<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="t d">
<title id="t">Using the FixPin extension</title>
<desc id="d">Click the toolbar button, the page dims, you click the broken button and send. The link is copied.</desc>
<style>
*{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.loop{animation-duration:10s;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
#ripple{transform-origin:742px 28px;animation-name:rip}
@keyframes rip{0%,4%{transform:scale(.2);opacity:0}8%{opacity:.7}18%{transform:scale(2.6);opacity:0}100%{opacity:0}}
#dim{animation-name:dim}
@keyframes dim{0%,14%{opacity:0}22%,86%{opacity:.35}94%,100%{opacity:0}}
#hint{animation-name:hint}
@keyframes hint{0%,18%{opacity:0}24%,40%{opacity:1}46%,100%{opacity:0}}
#cursor{animation-name:cur}
@keyframes cur{0%{transform:translate(690px,70px);opacity:0}4%{opacity:1}10%{transform:translate(742px,36px)}26%{transform:translate(742px,36px)}40%{transform:translate(520px,250px)}48%{transform:translate(520px,250px)}66%{transform:translate(662px,330px)}72%{transform:translate(662px,330px);opacity:1}78%,100%{opacity:0}}
#mark{opacity:0;animation-name:mark}
@keyframes mark{0%,44%{opacity:0;transform:scale(1.2)}50%,86%{opacity:1;transform:none}94%,100%{opacity:0}}
#mark{transform-origin:520px 250px}
#panel{opacity:0;animation-name:panel}
@keyframes panel{0%,52%{opacity:0;transform:translateY(14px)}58%,86%{opacity:1;transform:none}94%,100%{opacity:0}}
#toast{opacity:0;animation-name:toast}
@keyframes toast{0%,72%{opacity:0;transform:translateY(8px)}78%,92%{opacity:1;transform:none}98%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.loop{animation:none!important}#dim{opacity:.35}#mark,#panel,#toast{opacity:1;transform:none}#cursor,#ripple,#hint{opacity:0}}
</style>
<rect width="800" height="400" rx="18" fill="#f3f5fb"/>
<rect x="20" y="10" width="760" height="380" rx="14" fill="#fff" stroke="#d6dbe8"/>
<path d="M20 24a14 14 0 0 1 14-14h732a14 14 0 0 1 14 14v34H20z" fill="#e8ecf6"/>
<circle cx="44" cy="34" r="5" fill="#c3cadb"/><circle cx="62" cy="34" r="5" fill="#c3cadb"/><circle cx="80" cy="34" r="5" fill="#c3cadb"/>
<rect x="104" y="24" width="540" height="20" rx="10" fill="#fff"/><text x="120" y="38" font-size="11" fill="#7b8499">bluebird-bakery.example/order</text>
<rect x="728" y="14" width="28" height="28" rx="7" fill="#fff" stroke="#d6dbe8"/><rect x="735" y="21" width="14" height="14" rx="3" fill="none" stroke="#3b5bdb" stroke-width="2" stroke-dasharray="4 2"/><circle cx="742" cy="28" r="2.5" fill="#ffd43b"/>
<circle id="ripple" class="loop" cx="742" cy="28" r="16" fill="none" stroke="#3b5bdb" stroke-width="3" opacity="0"/>
<text x="56" y="116" font-size="28" font-weight="700" fill="#2a2f3d">Order a cake</text>
<rect x="56" y="132" width="200" height="9" rx="4" fill="#dfe3ee"/>
<rect x="56" y="180" width="200" height="170" rx="12" fill="#fff8ee" stroke="#eadcc6"/><rect x="70" y="194" width="172" height="60" rx="8" fill="#f6c9a0"/><rect x="70" y="270" width="110" height="9" rx="4" fill="#cdbfa8"/><rect x="70" y="310" width="100" height="28" rx="14" fill="#2f5bd8"/>
<rect x="280" y="180" width="200" height="170" rx="12" fill="#fff8ee" stroke="#eadcc6"/><rect x="294" y="194" width="172" height="60" rx="8" fill="#f2a7b8"/><rect x="294" y="270" width="110" height="9" rx="4" fill="#cdbfa8"/><rect x="294" y="310" width="100" height="28" rx="14" fill="#2f5bd8"/>
<rect x="504" y="180" width="236" height="170" rx="12" fill="#fff8ee" stroke="#eadcc6"/><rect x="518" y="194" width="208" height="40" rx="8" fill="#c9b08a"/><rect x="518" y="270" width="150" height="9" rx="4" fill="#cdbfa8"/><rect x="518" y="236" width="140" height="28" rx="14" fill="#2f5bd8"/><text x="588" y="255" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">Place your order</text>
<rect id="dim" class="loop" x="20" y="58" width="760" height="332" fill="#0c1020" opacity="0"/>
<g id="hint" class="loop" opacity="0"><rect x="250" y="76" width="300" height="32" rx="16" fill="#1b1f2a"/><text x="400" y="97" text-anchor="middle" font-size="13" fill="#fff">Click the problem or drag a box</text></g>
<g id="mark" class="loop"><rect x="508" y="232" width="152" height="36" rx="8" fill="rgba(224,49,49,.14)" stroke="#e03131" stroke-width="4"/><circle cx="508" cy="232" r="12" fill="#e03131"/><text x="508" y="236.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1</text></g>
<g id="panel" class="loop"><rect x="470" y="288" width="280" height="86" rx="12" fill="#fff" stroke="#d6dbe8"/><text x="486" y="312" font-size="12" fill="#5b6475">1 spot marked · 7 days</text><rect x="486" y="322" width="248" height="14" rx="7" fill="#f3f5fb"/><rect x="486" y="344" width="60" height="22" rx="11" fill="#fff" stroke="#c3cadb"/><text x="516" y="359" font-size="11" text-anchor="middle" fill="#2a2f3d">Cancel</text><rect x="660" y="344" width="74" height="22" rx="11" fill="#3b5bdb"/><text x="697" y="359" font-size="11" font-weight="600" text-anchor="middle" fill="#fff">Send</text></g>
<g id="toast" class="loop"><rect x="244" y="344" width="210" height="32" rx="16" fill="#2f9e44"/><text x="349" y="365" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">Link copied. Paste it anywhere.</text></g>
<g id="cursor" class="loop" opacity="0"><path d="M0 0l0 20 5-5 4 9 3-1.5-4-9 7 0z" fill="#111" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></g>
</svg>
