<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="t d">
<title id="t">How FixPin works</title>
<desc id="d">A cursor circles a broken button on a web page, a note appears, a private link is created, and the link counts down and disappears.</desc>
<style>
*{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.loop{animation-duration:12s;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
#cursor{animation-name:cur}
@keyframes cur{0%{transform:translate(120px,330px);opacity:0}6%{opacity:1}14%{transform:translate(430px,236px)}26%{transform:translate(520px,262px)}34%{transform:translate(540px,290px);opacity:1}40%{opacity:0}100%{opacity:0}}
#box{stroke-dasharray:420;stroke-dashoffset:420;animation-name:box}
@keyframes box{0%,13%{stroke-dashoffset:420;opacity:1}26%{stroke-dashoffset:0}88%{stroke-dashoffset:0;opacity:1}94%,100%{stroke-dashoffset:0;opacity:0}}
#badge{transform-origin:432px 238px;animation-name:badge}
@keyframes badge{0%,26%{transform:scale(0)}31%{transform:scale(1.25)}34%,88%{transform:scale(1)}94%,100%{transform:scale(0)}}
#note{animation-name:note}
@keyframes note{0%,34%{opacity:0;transform:translateY(8px)}42%,86%{opacity:1;transform:none}94%,100%{opacity:0}}
#panel{animation-name:panel}
@keyframes panel{0%,48%{transform:translateX(330px)}56%,84%{transform:translateX(0)}94%,100%{transform:translateX(330px)}}
#ring{stroke-dasharray:138;stroke-dashoffset:0;animation-name:ring}
@keyframes ring{0%,60%{stroke-dashoffset:0}84%{stroke-dashoffset:138}100%{stroke-dashoffset:138}}
#gone{animation-name:gone}
@keyframes gone{0%,84%{opacity:0}90%,97%{opacity:1}100%{opacity:0}}
#copy{animation-name:copy}
@keyframes copy{0%,62%{opacity:0}66%,84%{opacity:1}90%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.loop{animation:none!important}#panel{transform:translateX(0)}#note,#badge,#copy{opacity:1;transform:none}#box{stroke-dashoffset:0}#cursor,#gone{opacity:0}}
</style>
<rect width="800" height="420" rx="18" fill="#f3f5fb"/>
<!-- browser -->
<g>
<rect x="30" y="30" width="520" height="360" rx="14" fill="#fff" stroke="#d6dbe8"/>
<path d="M30 44a14 14 0 0 1 14-14h492a14 14 0 0 1 14 14v22H30z" fill="#e8ecf6"/>
<circle cx="52" cy="48" r="5" fill="#c3cadb"/><circle cx="70" cy="48" r="5" fill="#c3cadb"/><circle cx="88" cy="48" r="5" fill="#c3cadb"/>
<rect x="116" y="39" width="260" height="18" rx="9" fill="#fff"/>
<text x="130" y="52" font-size="11" fill="#7b8499">bluebird-bakery.example/order</text>
<text x="56" y="112" font-size="26" font-weight="700" fill="#2a2f3d">Order a cake</text>
<rect x="56" y="126" width="190" height="9" rx="4" fill="#dfe3ee"/>
<rect x="56" y="170" width="140" height="150" rx="12" fill="#fff8ee" stroke="#eadcc6"/><rect x="68" y="182" width="116" height="52" rx="8" fill="#f6c9a0"/><rect x="68" y="248" width="80" height="8" rx="4" fill="#cdbfa8"/><rect x="68" y="278" width="70" height="26" rx="13" fill="#2f5bd8"/>
<rect x="212" y="170" width="140" height="150" rx="12" fill="#fff8ee" stroke="#eadcc6"/><rect x="224" y="182" width="116" height="52" rx="8" fill="#f2a7b8"/><rect x="224" y="248" width="80" height="8" rx="4" fill="#cdbfa8"/><rect x="224" y="278" width="70" height="26" rx="13" fill="#2f5bd8"/>
<rect x="368" y="170" width="160" height="150" rx="12" fill="#fff8ee" stroke="#eadcc6"/><rect x="380" y="182" width="136" height="52" rx="8" fill="#c9b08a"/><text x="470" y="256" font-size="12" font-weight="700" fill="#2a2f3d">£NaN</text><rect x="380" y="270" width="120" height="30" rx="15" fill="#2f5bd8"/><text x="440" y="289" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">Place your order</text>
</g>
<!-- the mark -->
<rect id="box" class="loop" x="372" y="266" width="140" height="40" rx="9" fill="rgba(224,49,49,.12)" stroke="#e03131" stroke-width="4" opacity="0"/>
<g id="badge" class="loop"><circle cx="372" cy="266" r="12" fill="#e03131"/><text x="372" y="270.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1</text></g>
<g id="note" class="loop" opacity="0"><rect x="200" y="326" width="262" height="40" rx="10" fill="#1b1f2a"/><text x="216" y="351" font-size="13" fill="#fff">“This button does nothing”</text></g>
<!-- side panel: the link -->
<g id="panel" class="loop" style="transform:translateX(330px)">
<rect x="566" y="30" width="204" height="360" rx="14" fill="#fff" stroke="#d6dbe8"/>
<text x="584" y="64" font-size="14" font-weight="700" fill="#2a2f3d">Your link is ready</text>
<rect x="584" y="78" width="168" height="30" rx="8" fill="#f3f5fb" stroke="#d6dbe8"/>
<text x="594" y="97" font-size="10.5" fill="#5b6475">fixpin.app/r/x-1vSU-dQT7…</text>
<rect x="584" y="120" width="86" height="30" rx="8" fill="#3b5bdb"/><text x="627" y="139" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">Copy link</text>
<g id="copy" class="loop" opacity="0"><circle cx="702" cy="135" r="11" fill="#2f9e44"/><path d="M696 135l4 4 8-9" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="584" y="188" font-size="12" fill="#5b6475">Expires in 7 days</text>
<circle cx="627" cy="258" r="22" fill="none" stroke="#e1e5f0" stroke-width="6"/>
<circle id="ring" class="loop" cx="627" cy="258" r="22" fill="none" stroke="#3b5bdb" stroke-width="6" stroke-linecap="round" transform="rotate(-90 627 258)"/>
<text x="627" y="263" text-anchor="middle" font-size="13" font-weight="700" fill="#2a2f3d">7d</text>
<text x="584" y="316" font-size="11.5" fill="#5b6475">Then the report and the</text><text x="584" y="332" font-size="11.5" fill="#5b6475">screenshot are deleted.</text>
</g>
<g id="gone" class="loop" opacity="0"><rect x="592" y="352" width="152" height="26" rx="13" fill="#2a2f3d"/><text x="668" y="369" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">Deleted. Poof.</text></g>
<!-- cursor -->
<g id="cursor" class="loop" opacity="0"><path d="M0 0l0 20 5-5 4 9 3-1.5-4-9 7 0z" fill="#111" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></g>
</svg>
